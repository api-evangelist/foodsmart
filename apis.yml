aid: foodsmart
name: Foodsmart
description: >-
  Foodsmart is a telenutrition company that pairs the nation's largest network
  of registered dietitians with a digital food-benefits platform, delivering
  personalized nutrition care via telehealth to more than three million members.
  The company partners with health plans and employers to reach Medicaid,
  Medicare, and commercial members, combining one-on-one dietitian counseling
  with meal planning, grocery ordering, and SNAP benefits enrollment. Foodsmart's
  "Foodscription" model connects clinical nutrition guidance to affordable,
  healthy food access to improve outcomes and lower the cost of diet-related
  chronic disease. This profile was surfaced as a Mayfield portfolio company and
  enriched by the API Evangelist pipeline; Foodsmart exposes no public developer
  API, SDKs, or documentation surface at this time.
